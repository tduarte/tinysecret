# Example: Gluetun reads NordVPN credentials from tinysecret's folder.
# Fill NORDVPN_USER and NORDVPN_PASSWORD in the tinysecret UI first.
services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: nordvpn
      VPN_TYPE: openvpn
      OPENVPN_USER_SECRETFILE: /secrets/NORDVPN_USER
      OPENVPN_PASSWORD_SECRETFILE: /secrets/NORDVPN_PASSWORD
      SERVER_COUNTRIES: Netherlands
    volumes:
      - /mnt/SSDs/Applications/secrets:/secrets:ro   # same folder, read-only
